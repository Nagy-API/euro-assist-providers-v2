# Euro Assist Providers V2 REST API. OpenAPI 3.1.
# Hand-maintained; tests/Feature/Api/OpenApiContractTest.php parses this file and verifies that every
# documented path is a real GET route and vice versa. Keep it in the restricted YAML subset used here
# (block mappings/sequences, single-line scalars, simple flow lists) so the test parser can read it.
openapi: 3.1.0
info:
  title: Euro Assist Providers API
  version: 2.0.0
  summary: Read-only provider directory API.
  description: "Read-only. There are no write endpoints. V1 compatibility is NOT claimed: consumers of the legacy API are unverified and the response shapes differ. Access requires a personal access token with the providers:read ability unless the operator enabled public reads (config providers.api.public_read, default off, decision D7 pending)."
servers:
  - url: /api/v2
    description: Relative to the application origin.
security:
  - bearerAuth: []
tags:
  - name: providers
    description: Canonical providers (one record per branch/service location) with Arabic and English text.
  - name: reference
    description: Provider types and featured brand entries.
paths:
  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: List providers
      description: "Paginated list. Text comes from the requested lang; locale_fallback is true when another locale was used. Default sort id ascending; ties are broken by id. Only active providers unless is_active=false is requested by an authenticated principal."
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: q
          in: query
          required: false
          description: "Literal substring search (wildcards % and _ match themselves) over name, address, city, district, specialization of every locale, plus phone and email. Max 100 characters."
          schema:
            type: string
            maxLength: 100
        - name: type
          in: query
          required: false
          description: Provider type key (see /provider-types).
          schema:
            type: string
            maxLength: 64
        - name: city
          in: query
          required: false
          description: Exact city in the lang locale.
          schema:
            type: string
            maxLength: 255
        - name: district
          in: query
          required: false
          description: Exact district in the lang locale.
          schema:
            type: string
            maxLength: 255
        - name: is_active
          in: query
          required: false
          description: "Default true. false (inactive providers) requires authentication; anonymous callers receive 403."
          schema:
            type: string
            enum: ['true', 'false', '1', '0']
        - name: sort
          in: query
          required: false
          description: "Whitelisted sort key, optionally prefixed with - for descending. name sorts by the lang locale and places providers without it last."
          schema:
            type: string
            enum: [id, -id, name, -name, updated_at, -updated_at]
            default: id
      responses:
        '200':
          description: A page of providers.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /providers/{id}:
    get:
      tags: [providers]
      operationId: getProvider
      summary: Get one provider
      description: "Unknown, soft-deleted and (for anonymous callers) inactive providers return 404."
      parameters:
        - name: id
          in: path
          required: true
          description: Provider id (positive integer).
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The provider with every stored translation.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /providers/names:
    get:
      tags: [providers]
      operationId: listProviderNames
      summary: Distinct provider names of one locale
      description: "Alphabetical, distinct names of active providers that have a translation in lang. Paginated."
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of names.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /providers/coordinates:
    get:
      tags: [providers]
      operationId: listProviderCoordinates
      summary: Map markers
      description: "Only active providers that have parsed coordinates. per_page is capped by providers.api.coordinates_max (default 5000) and the default page size is providers.api.coordinates_default_per_page (1000)."
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          required: false
          description: "1 to coordinates_max (default 5000); above it the request is rejected with 422."
          schema:
            type: integer
            minimum: 1
            maximum: 5000
        - name: type
          in: query
          required: false
          description: Provider type key.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: A page of markers.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /providers/distribution:
    get:
      tags: [providers]
      operationId: getProviderDistribution
      summary: Canonical providers per type
      description: "Counts active, non-deleted canonical providers per active type. A provider with both Arabic and English text counts once. This is NOT the legacy max(English, Arabic) estimate."
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Counts per type.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /provider-types:
    get:
      tags: [reference]
      operationId: listProviderTypes
      summary: Active provider types
      description: "Ordered by sort_order then id. Bounded (hard limit 500), not paginated."
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Provider types.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /featured-providers:
    get:
      tags: [reference]
      operationId: listFeaturedProviders
      summary: Featured brand entries
      description: "Active entries ordered by sort_order then id. Logos are not exposed (no authenticated media route exists for API clients)."
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of featured entries.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Personal access token (Laravel Sanctum) issued by an administrator with: php artisan api:token. Ability providers:read. Tokens expire (default 90 days) and stop working when the account is deactivated. Cookie/session authentication is not accepted."
  parameters:
    Lang:
      name: lang
      in: query
      required: false
      description: Response locale. Default en.
      schema:
        type: string
        enum: [ar, en]
        default: en
    Page:
      name: page
      in: query
      required: false
      description: Page number (1 to 100000).
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: "Page size, 1 to providers.api.max_per_page (default 100). A larger value is rejected with 422, never clamped. Default 25."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  headers:
    RateLimitLimit:
      description: Requests allowed per minute for this principal (or IP when anonymous).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying (429 only).
      schema:
        type: integer
  responses:
    Unauthorized:
      description: "Missing, invalid, expired or revoked token, or the account is inactive. Error code unauthenticated."
      headers:
        WWW-Authenticate:
          description: Always Bearer.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: "Token lacks the providers:read ability, the account lacks providers.view, or an anonymous caller asked for inactive providers. Error code forbidden."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Unknown, deleted or non-numeric resource. Error code not_found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: "Invalid query parameters (includes per_page above the maximum). Error code validation_failed; details maps each parameter to its messages."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests. Error code rate_limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: "Unexpected failure. Error code server_error; no internals are ever included."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [validation_failed, unauthenticated, forbidden, not_found, method_not_allowed, rate_limited, bad_request, server_error]
            message:
              type: string
            details:
              type: object
              description: Present for validation_failed only.
              additionalProperties:
                type: array
                items:
                  type: string
    PageMeta:
      type: object
      required: [api_version, current_page, last_page, per_page, total, from, to]
      properties:
        api_version:
          type: string
          const: v2
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: [integer, 'null']
        to:
          type: [integer, 'null']
        lang:
          type: string
          enum: [ar, en]
        max_per_page:
          type: integer
          description: Present on the coordinates endpoint.
    PageLinks:
      type: object
      required: [self, first, last, prev, next]
      properties:
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type: [string, 'null']
          format: uri
        next:
          type: [string, 'null']
          format: uri
    ItemMeta:
      type: object
      required: [api_version]
      properties:
        api_version:
          type: string
          const: v2
        lang:
          type: string
          enum: [ar, en]
    ItemLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string
          format: uri
    TypeRef:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
    Provider:
      type: object
      required: [id, type, locale, locale_fallback, available_locales, name, address, city, district, specialization, hours, discount_text, package_text, phone, email, website, map_url, latitude, longitude, is_active, updated_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        type:
          oneOf:
            - $ref: '#/components/schemas/TypeRef'
            - type: 'null'
        locale:
          type: [string, 'null']
          description: Locale of the translation actually used.
        locale_fallback:
          type: boolean
          description: True when locale differs from the requested lang.
        available_locales:
          type: array
          items:
            type: string
        name:
          type: [string, 'null']
        address:
          type: [string, 'null']
        city:
          type: [string, 'null']
        district:
          type: [string, 'null']
        specialization:
          type: [string, 'null']
        hours:
          type: [string, 'null']
          description: Exactly as stored (free text).
        discount_text:
          type: [string, 'null']
          description: Exactly as stored (free text).
        package_text:
          type: [string, 'null']
          description: Exactly as stored (free text).
        phone:
          type: [string, 'null']
          description: Exactly as stored (text; leading zeros and separators preserved).
        email:
          type: [string, 'null']
        website:
          type: [string, 'null']
        map_url:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        is_active:
          type: boolean
        updated_at:
          type: [string, 'null']
          format: date-time
    ProviderTranslation:
      type: object
      required: [name, address, city, district, specialization, hours, discount_text, package_text]
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
        address:
          type: [string, 'null']
        city:
          type: [string, 'null']
        district:
          type: [string, 'null']
        specialization:
          type: [string, 'null']
        hours:
          type: [string, 'null']
        discount_text:
          type: [string, 'null']
        package_text:
          type: [string, 'null']
    ProviderDetail:
      allOf:
        - $ref: '#/components/schemas/Provider'
        - type: object
          required: [translations]
          properties:
            translations:
              type: object
              description: Every stored translation keyed by locale (ar, en).
              additionalProperties:
                $ref: '#/components/schemas/ProviderTranslation'
    ProviderCoordinate:
      type: object
      required: [id, name, locale_fallback, type, latitude, longitude]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: [string, 'null']
        locale_fallback:
          type: boolean
        type:
          type: [string, 'null']
          description: Provider type key.
        latitude:
          type: number
        longitude:
          type: number
    ProviderType:
      type: object
      required: [key, label, labels, sort_order]
      additionalProperties: false
      properties:
        key:
          type: string
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        sort_order:
          type: integer
    FeaturedProvider:
      type: object
      required: [id, name, name_en, name_ar, type, sort_order]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        name_en:
          type: [string, 'null']
        name_ar:
          type: [string, 'null']
        type:
          oneOf:
            - $ref: '#/components/schemas/TypeRef'
            - type: 'null'
        sort_order:
          type: integer
    DistributionItem:
      type: object
      required: [type, label, providers]
      additionalProperties: false
      properties:
        type:
          type: string
        label:
          type: string
        providers:
          type: integer
    ProviderListResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
    ProviderDetailResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          $ref: '#/components/schemas/ProviderDetail'
        meta:
          $ref: '#/components/schemas/ItemMeta'
        links:
          $ref: '#/components/schemas/ItemLinks'
    NameListResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            type: string
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
    CoordinateListResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCoordinate'
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
    DistributionResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DistributionItem'
        meta:
          type: object
          required: [api_version, lang, total_providers, definition]
          properties:
            api_version:
              type: string
              const: v2
            lang:
              type: string
            total_providers:
              type: integer
            definition:
              type: string
        links:
          $ref: '#/components/schemas/ItemLinks'
    ProviderTypeListResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderType'
        meta:
          type: object
          required: [api_version, lang, total]
          properties:
            api_version:
              type: string
              const: v2
            lang:
              type: string
            total:
              type: integer
        links:
          $ref: '#/components/schemas/ItemLinks'
    FeaturedListResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedProvider'
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
